server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 隐藏版本号，避免暴露具体小版本
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # 供容器健康检查与 Uptime Kuma 探测使用
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "ok\n";
    }

    # 禁止访问 .git / .env 等隐藏文件（保留 ACME 校验路径）
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(?:css|js|png|jpe?g|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
