groups:
  - name: host
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "实例 {{ $labels.instance }} 抓取失败"
          description: "job={{ $labels.job }} 已持续 2 分钟无法抓取指标，先确认容器是否退出。"

      - alert: DiskWillFillIn4Hours
        expr: |
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 4 * 3600
          ) < 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} 预计 4 小时内写满"
          description: "按最近 6 小时的增长速率外推，4 小时后可用空间为负值。请立刻检查日志与临时文件。"

      - alert: DiskUsageHigh
        expr: |
          (
            1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          ) * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} 使用率超过 85%"
          description: "当前使用率 {{ printf \"%.1f\" $value }}%，属于需要处理但尚未影响服务的水平。"

      - alert: MemoryUsageHigh
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率超过 90%"
          description: "可用内存不足 10%，关注是否有进程内存泄漏。"

      - alert: NodeRebooted
        expr: time() - node_boot_time_seconds < 600
        labels:
          severity: info
        annotations:
          summary: "主机在 10 分钟内重启过"
          description: "若非计划内维护，需要排查是否为 OOM 或内核异常。"

  - name: self
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus 配置重载失败"
          description: "上一次配置热加载未成功，当前仍在用旧配置运行。"

      - alert: AlertmanagerNotificationFailing
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager 外发告警持续失败"
          description: "接收端（飞书中继）可能不可达，告警只落库没有送达。"
